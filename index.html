<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Mery chít mợt 🎄</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#14001f,#000);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:monospace;
  color:white;
  text-align:center;
}

/* ❄ TUYẾT */
.snow{
  position:fixed;
  top:-10px;
  animation:fall linear infinite;
  pointer-events:none;
}
@keyframes fall{
  to{transform:translateY(110vh)}
}

/* 🎄 CÂY THÔNG ASCII – TO & CÂN */
.tree{
  font-size:28px;
  line-height:1.1;
  white-space:pre;
  cursor:pointer;
  user-select:none;
}
.star{
  color:gold;
  text-shadow:0 0 20px gold;
}
.light{
  animation:blink 1.2s infinite alternate;
}
@keyframes blink{
  0%{color:red}
  25%{color:gold}
  50%{color:hotpink}
  75%{color:cyan}
  100%{color:lime}
}

/* 💖 CHỮ */
#msg{
  display:none;
  margin-top:18px;
  font-size:30px;
  color:#ffb6d9;
  text-shadow:0 0 15px pink;
}

/* 🎵 NÚT NHẠC */
#playBtn{
  margin-top:22px;
  padding:16px 34px;
  font-size:20px;
  border:none;
  border-radius:40px;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  color:white;
  cursor:pointer;
  box-shadow:0 0 30px rgba(255,120,150,.9);
}
</style>
</head>

<body>

<!-- ❄ TUYẾT -->
<script>
for(let i=0;i<100;i++){
  const s=document.createElement("div");
  s.className="snow";
  s.innerHTML="❄";
  s.style.left=Math.random()*100+"vw";
  s.style.fontSize=12+Math.random()*18+"px";
  s.style.opacity=Math.random();
  s.style.animationDuration=3+Math.random()*5+"s";
  document.body.appendChild(s);
}
</script>

<!-- 🎄 CÂY THÔNG -->
<div class="tree" onclick="showMsg()">
          <span class="star">⭐</span>
         <span class="light">***</span>
        <span class="light">*****</span>
       <span class="light">*******</span>
      <span class="light">*********</span>
     <span class="light">***********</span>
    <span class="light">*************</span>
   <span class="light">***************</span>
  <span class="light">*****************</span>
 <span class="light">*******************</span>
<span class="light">*********************</span>
            |||
            |||
</div>

<div id="msg">💖 Mery chít mợt 💖</div>

<!-- 🎵 NÚT NHẠC -->
<button id="playBtn">🎶 BẤM ĐỂ NGHE JINGLE BELLS 🎶</button>

<!-- 🎵 NHẠC JINGLE BELLS -->
<audio id="music">
  <source src="https://cdn.pixabay.com/download/audio/2022/12/20/audio_0b9c9d0e3c.mp3" type="audio/mpeg">
</audio>

<script>
const music=document.getElementById("music");
document.getElementById("playBtn").addEventListener("click",()=>{
  music.currentTime=0;
  music.play();      // <-- GỌI TRỰC TIẾP: KHÔNG BỊ CHẶN
});
function showMsg(){
  document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
