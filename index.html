<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mery chít mợt</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#0b0014;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:monospace;
  text-align:center;
}
.tree{
  font-size:30px;
  line-height:1.1;
  cursor:pointer;
}
.star{color:gold}
.light{animation:blink 1.2s infinite alternate}
@keyframes blink{
  0%{color:red}50%{color:gold}100%{color:lime}
}
button{
  margin-top:20px;
  padding:14px 30px;
  font-size:20px;
  border:none;
  border-radius:40px;
  background:#ff6fae;
  color:white;
  cursor:pointer;
}
#msg{display:none;font-size:28px;color:pink;margin-top:15px}
</style>
</head>

<body>

<div class="tree" onclick="showMsg()">
<span class="star">⭐</span>
<br>
<span class="light">***</span><br>
<span class="light">*****</span><br>
<span class="light">*******</span><br>
<span class="light">*********</span><br>
<span class="light">***********</span><br>
<span class="light">*************</span><br>
<span class="light">***************</span><br>
<span class="light">*****************</span><br>
|||<br>|||
</div>

<div id="msg">💖 Mery chít mợt 💖</div>

<button onclick="playMusic()">🎵 BẤM ĐỂ NGHE JINGLE BELLS</button>

<audio id="music" preload="auto">
  <source src="jingle-bells.mp3" type="audio/mpeg">
</audio>

<script>
const music=document.getElementById("music");
function playMusic(){
  music.currentTime=0;
  music.play();
}
function showMsg(){
  document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
